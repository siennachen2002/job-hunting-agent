<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Job Hunter Agent</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page:#FAF9F7; --surface:#FFFFFF; --sunk:#F4F2EF; --hover:#F1EFEB;
    --ink:#1C1917; --ink2:#44403C; --mute:#78716C; --faint:#A8A29E;
    --line:#E7E4DF; --line2:#F0EDE9;
    --green:#16A34A; --blue:#2563EB; --red:#E5372A; --red-strong:#C42A1E; --red-soft:#FDECEA; --orange:#F27420; --orange-soft:#FEF1E7;
    --shadow:0 1px 2px rgba(28,25,23,.04), 0 1px 1px rgba(28,25,23,.03);
    --shadow-lg:0 24px 60px -12px rgba(28,25,23,.28);
    --sans:"Geist", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --page:#141312; --surface:#1C1B19; --sunk:#232120; --hover:#2A2826; --ink:#F5F3F0; --ink2:#D6D3CE; --mute:#A39E98; --faint:#6F6A64;
    --line:#2E2B28; --line2:#262422; --red-soft:#3A1D1A; --orange-soft:#3A2617; color-scheme:dark; } }
  :root[data-theme="dark"] { --page:#141312; --surface:#1C1B19; --sunk:#232120; --hover:#2A2826; --ink:#F5F3F0; --ink2:#D6D3CE; --mute:#A39E98; --faint:#6F6A64;
    --line:#2E2B28; --line2:#262422; --red-soft:#3A1D1A; --orange-soft:#3A2617; color-scheme:dark; }

  * { box-sizing:border-box; } html, body { margin:0; height:100%; }
  body { background:var(--page); color:var(--ink); font:14.5px/1.5 var(--sans); display:flex; -webkit-font-smoothing:antialiased; }
  a { color:inherit; } button { font:inherit; }
  svg.i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* sidebar */
  aside { width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 22px; font-weight:600; font-size:14.5px; letter-spacing:-.01em; } .brand img { width:28px; height:28px; }
  .nav { all:unset; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink2); cursor:pointer; font-weight:500; position:relative; }
  .nav:hover { background:var(--hover); }
  .nav.on { background:var(--sunk); color:var(--ink); } .nav.on svg.i { color:var(--red); }
  .nav .badge { margin-left:auto; }
  .badge { font:600 11.5px/1 var(--mono); color:#fff; background:var(--red); border-radius:999px; padding:4px 7px; }
  .badge:empty { display:none; }
  .tabs { display:contents; } .ls { display:none; }

  /* page */
  main { flex:1; min-width:0; overflow:auto; }
  /* accounts: yours, other stories, demo accounts */
  .acct-wrap { position:relative; margin:-10px 0 14px; }
  .acct { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px; border-radius:12px; border:1px solid var(--line); background:var(--surface); cursor:pointer; }
  .acct:hover { background:var(--hover); }
  .av { width:28px; height:28px; border-radius:50%; background:var(--sunk); display:flex; align-items:center; justify-content:center; font-weight:650; font-size:13px; color:var(--ink2); flex:none; }
  .acct .an { flex:1; min-width:0; } .acct b { display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct small { display:block; font-size:11.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .acct .cv { color:var(--faint); font-size:11px; }
  body.is-demo .acct { border-color:var(--orange); } body.is-demo .acct .av { background:var(--orange-soft); color:var(--orange); } body.is-demo .acct small { color:var(--orange); }
  .acct-menu { position:absolute; left:0; width:min(300px, calc(100vw - 24px)); top:calc(100% + 6px); z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; }
  .acct-menu button { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:8px; cursor:pointer; font-size:13.5px; }
  .acct-menu button:hover { background:var(--hover); } .acct-menu button > span:nth-child(2) { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct-menu i { flex:none; font-style:normal; font-size:11px; color:var(--orange); border:1px solid currentColor; border-radius:999px; padding:1px 7px; }
  .acct-row { display:flex; align-items:center; } .acct-menu .acct-row > button:first-child { flex:1; min-width:0; }
  .acct-menu .rm { width:auto; flex:none; font-size:12px; color:var(--mute); padding:6px 8px; } .acct-menu .rm:hover { color:var(--red); background:none; }
  .acct-menu .new { color:var(--red); font-weight:600; border-top:1px solid var(--line2); border-radius:0 0 8px 8px; margin-top:4px; padding-top:10px; }
  .demo-bar { display:none; background:var(--orange-soft); border:1px solid color-mix(in srgb, var(--orange) 40%, var(--line)); border-radius:12px; padding:10px 14px; font-size:13.5px; margin:0 0 18px; }
  body.is-demo .demo-bar { display:block; }
  .switching[hidden] { display:none; }
  .switching { position:fixed; inset:0; z-index:90; background:color-mix(in srgb, var(--page) 86%, transparent); display:flex; align-items:center; justify-content:center; }
  .switching > div { display:flex; align-items:center; gap:12px; font-size:15px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 22px; box-shadow:var(--shadow); }
  .page { max-width:1100px; margin:0 auto; padding:44px 48px 120px; }
  .ph { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; }
  h1 { font-size:28px; line-height:1.15; margin:0; letter-spacing:-.025em; font-weight:650; }
  .sub { color:var(--mute); margin:6px 0 0; }

  .seg { display:inline-flex; max-width:100%; overflow-x:auto; gap:2px; padding:3px; background:var(--sunk); border-radius:10px; margin-bottom:20px; }
  .seg button { all:unset; cursor:pointer; white-space:nowrap; padding:6px 12px; border-radius:8px; color:var(--mute); font-weight:500; display:flex; align-items:center; gap:8px; }
  .seg button:hover { color:var(--ink); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(28,25,23,.08), 0 0 0 1px var(--line); }
  .seg .n { font:500 12px/1 var(--mono); color:var(--faint); } .seg button.on .n { color:var(--red); }

  /* buttons */
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:9px; font-weight:500; font-size:14px;
         border:1px solid var(--line); background:var(--surface); color:var(--ink); transition:background .12s, border-color .12s, box-shadow .12s; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 1px 2px rgba(196,42,30,.35); }
  .btn.primary:hover { background:var(--red-strong); border-color:var(--red-strong); }
  .btn.quiet { border-color:transparent; background:transparent; color:var(--ink2); } .btn.quiet:hover { background:var(--hover); }
  .btn.danger:hover { color:var(--red); }
  .btn.outline-red { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, var(--line)); } .btn.outline-red:hover { background:var(--red-soft); }
  .btn[disabled] { pointer-events:none; background:var(--sunk); border-color:var(--line); color:var(--faint); box-shadow:none; }
  .btn.sm { height:30px; padding:0 11px; font-size:13.5px; }
  .iconbtn { all:unset; cursor:pointer; width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--mute); }
  .iconbtn:hover { background:var(--hover); color:var(--ink); }

  /* score ring */
  .score { display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
  .ring { position:relative; width:48px; height:48px; } .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 13px/1 var(--mono); letter-spacing:-.02em; }
  .ring.sm { width:38px; height:38px; } .ring.sm b { font-size:11.5px; }
  .score small { font-size:10.5px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
  .unrated { font-size:12px; color:var(--faint); border:1px dashed var(--line); border-radius:999px; padding:3px 9px; white-space:nowrap; }

  /* review queue: list on the left, one job at a time on the right */
  .split { display:grid; grid-template-columns:340px minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; height:calc(100vh - 196px); min-height:540px; }
  .queue { border-right:1px solid var(--line); overflow:auto; background:color-mix(in srgb, var(--sunk) 35%, var(--surface)); }
  .qi { all:unset; box-sizing:border-box; width:100%; display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line2); cursor:pointer; }
  .qi:hover { background:var(--hover); }
  .qrow { display:flex; align-items:stretch; border-bottom:1px solid var(--line2); }
  .qrow .qi { border-bottom:0; padding-left:4px; width:auto; flex:1; min-width:0; }
  .qrow.on { background:var(--surface); box-shadow:inset 3px 0 0 var(--red); }
  .qrow.on .qi.on { box-shadow:none; }
  .ck { display:flex; align-items:center; padding:0 6px 0 16px; cursor:pointer; }
  .ck input { width:16px; height:16px; margin:0; accent-color:var(--red); cursor:pointer; }
  .bulk { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px; padding:10px 16px 10px 0; background:color-mix(in srgb, var(--sunk) 35%, var(--surface)); border-bottom:1px solid var(--line); font-size:13px; color:var(--mute); }
  .bulk .btn { margin-left:auto; }
  .pstep { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line2); font-size:14px; }
  .pstep .num { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--sunk); color:var(--mute); }
  .pstep.done .num { background:var(--green); color:#fff; }
  .pstep .srow { margin-top:8px; }
  .qr { margin:12px 0 8px; } .qr img, .qr canvas { border:8px solid #fff; border-radius:8px; }
  .plink { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .plink code { font-family:var(--mono); font-size:12px; background:var(--sunk); padding:4px 8px; border-radius:6px; word-break:break-all; }
  .qi.on { background:var(--surface); box-shadow:inset 3px 0 0 var(--red); }
  .qi .t { flex:1; min-width:0; }
  .qi .c { font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qi .ti { font-weight:600; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qi .st { font-size:12px; margin-top:3px; color:var(--mute); display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .qi .st > span:last-child, .qi .st { min-width:0; }
  .qi .st.o { color:var(--orange); font-weight:500; } .qi .st.r { color:var(--red); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .mono { width:36px; height:36px; flex:none; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:650; font-size:15px; color:var(--ink2); }
  .mono.lg { width:48px; height:48px; border-radius:12px; font-size:19px; background:var(--sunk); }

  .detail { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .d-scroll { flex:1; overflow:auto; padding:28px 34px 34px; }
  .d-head { display:flex; gap:16px; align-items:flex-start; }
  .d-head .tt { flex:1; min-width:0; }
  .d-head .co { font-size:14px; color:var(--mute); font-weight:500; }
  .d-head h2 { margin:2px 0 0; font-size:24px; line-height:1.2; letter-spacing:-.025em; font-weight:650; }
  .back-m { display:none; }
  .facts { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .fact { display:inline-flex; align-items:center; gap:7px; font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink2); background:var(--surface); }
  .fact svg.i { width:14px; height:14px; color:var(--mute); } .fact b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .links { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:14px; font-size:13.5px; }
  .lk { color:var(--red); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:4px; cursor:pointer; } .lk:hover { text-decoration:underline; text-underline-offset:3px; }
  .lk svg.i { width:13px; height:13px; }

  .section { margin-top:30px; }
  .sh { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line2); }
  .sh h4 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; color:var(--mute); display:flex; align-items:center; gap:7px; }
  .sh h4 .n { font-family:var(--mono); color:var(--faint); letter-spacing:0; }
  .section.ask .sh h4 { color:var(--orange); } .section.ask .sh h4 .n { color:var(--orange); }
  .docs { display:flex; gap:16px; }
  .doc { all:unset; cursor:zoom-in; display:block; width:136px; }
  .doc .pv { width:136px; height:176px; border-radius:8px; border:1px solid var(--line); background:#fff; overflow:hidden; transition:transform .15s, box-shadow .15s; }
  .doc:hover .pv { transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(28,25,23,.3); }
  .doc img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .doc .lb { font-size:12.5px; color:var(--ink2); margin-top:8px; font-weight:500; } .doc .lb span { color:var(--mute); font-weight:400; }
  .doc .pv { position:relative; }
  .rbadge { position:absolute; top:6px; right:6px; display:flex; align-items:center; gap:5px; background:var(--ink); color:#fff; font-size:10.5px; font-weight:600; border-radius:999px; padding:3px 8px 3px 6px; }
  .rbadge .spin { width:9px; height:9px; border-width:1.5px; border-color:rgba(255,255,255,.35); border-top-color:#fff; }
  .gdot { position:absolute; top:7px; right:7px; width:11px; height:11px; border-radius:50%; background:var(--green); box-shadow:0 0 0 2px #fff; }
  .rev { width:260px; height:176px; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:10px 10px 8px; box-sizing:border-box; }
  .rev .rh { font-size:12.5px; font-weight:600; color:var(--ink2); }
  .rev textarea { flex:1; border:0; resize:none; padding:6px 0; font:inherit; font-size:13px; background:transparent; box-shadow:none !important; outline:none; }
  .rev .rb { display:flex; justify-content:space-between; align-items:center; }
  .rev .mic { width:28px; height:28px; margin:0; }
  .doc .mail.cover { font-size:7.5px; line-height:1.45; } .doc .mail.need b { color:var(--orange); font-size:9px; }
  .doc .mail { font-size:6.5px; line-height:1.4; white-space:pre-wrap; padding:9px; color:#333; }
  .doc .none { height:100%; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--faint); padding:12px; background:var(--sunk); }
  .qa { display:flex; flex-direction:column; gap:14px; }
  .field label { display:block; font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.4; font-weight:500; }
  .kv { display:grid; grid-template-columns:minmax(140px, 34%) minmax(0,1fr); }
  .kv > div { padding:10px 0; border-bottom:1px solid var(--line2); font-size:13.5px; overflow-wrap:anywhere; }
  .kv > div:nth-last-child(-n+2) { border-bottom:0; }
  .kv .k { color:var(--mute); padding-right:18px; } .kv .v { color:var(--ink); white-space:pre-wrap; }
  .kv .v input, .kv .v textarea { margin:-4px 0; }
  .why-box { font-size:14px; color:var(--ink2); line-height:1.6; }
  .jd { white-space:pre-wrap; font-size:14px; line-height:1.65; color:var(--ink2); }
  .d-foot { display:flex; align-items:center; gap:8px; padding:14px 34px; border-top:1px solid var(--line); background:var(--surface); }
  .hint { font-size:13px; color:var(--mute); margin-left:6px; }
  .stamp { font-size:13.5px; color:var(--ink2); display:flex; align-items:center; gap:7px; } .stamp svg { color:var(--red); }
  input[type=text], input[type=password], textarea, select { font:inherit; font-size:14px; width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); transition:border-color .12s, box-shadow .12s; }
  input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus { outline:none; border-color:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent); }
  textarea { min-height:90px; resize:vertical; line-height:1.5; }
  .banner { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--ink2); padding:11px 14px; border:1px solid var(--line); border-left:3px solid var(--orange); border-radius:10px; background:var(--surface); margin-bottom:14px; }
  .banner code { font-family:var(--mono); font-size:12.5px; background:var(--sunk); padding:1px 5px; border-radius:4px; }
  .err { font-size:12.5px; color:var(--red); }
  .empty { text-align:center; color:var(--mute); padding:64px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:16px; }
  @media (max-width:760px) {
    .split { grid-template-columns:1fr; height:auto; min-height:0; } .detail { display:none; } .queue { border-right:0; }
    .split.open .detail { display:flex; } .split.open .queue { display:none; }
    .back-m { display:inline-flex; margin:-6px 0 12px -8px; } .d-scroll { padding:20px 18px; } .d-foot { padding:12px 18px; flex-wrap:wrap; }
    .kv { grid-template-columns:1fr; } .kv .k { padding:10px 0 0; border-bottom:0 !important; } .kv .v { padding-top:2px; }
  }

  /* storybook */
  .tell { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:14px; margin-bottom:26px; }
  .composer { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 18px 12px; display:flex; flex-direction:column; transition:border-color .12s, box-shadow .12s; }
  .composer:focus-within { border-color:color-mix(in srgb, var(--orange) 55%, var(--line)); box-shadow:0 0 0 4px color-mix(in srgb, var(--orange) 12%, transparent); }
  .composer h2 { margin:0 0 4px; font-size:18px; letter-spacing:-.015em; font-weight:620; }
  .composer textarea { border:0; padding:6px 0; min-height:92px; box-shadow:none !important; font-size:15px; resize:none; background:transparent; }
  .composer .try { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 12px; }
  .pill { all:unset; cursor:pointer; font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink2); background:var(--surface); transition:all .12s; }
  .pill:hover { border-color:var(--orange); color:var(--orange); background:var(--orange-soft); }
  .chat-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; } .chat-h h2 { margin:0; } .chat-h .lk { font-size:12.5px; background:none; border:0; cursor:pointer; }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:340px; overflow:auto; padding:4px 2px 12px; border-bottom:1px solid var(--line2); margin-bottom:6px; }

  <div class="side-foot">
    <button class="btn refresh" id="refresh" onclick="refreshJobs()"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>Refresh</span></button>
    <div class="cap" id="refresh-cap"></div>
  </div>
</aside>
<main><div class="page"><div class="demo-bar" data-lve-skip><b>Demo account.</b> It finds real jobs and fills real application forms right up to Submit. Nothing is ever sent.</div><div id="page" data-lve-skip></div></div></main>
<div class="switching" id="switching" hidden><div><span class="spin"></span><b id="switching-t"></b></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (p, o) => fetch(p, o).then(r => r.json());
const post = (p, b) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b || {})});
const day = s => s ? new Date(s).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '';
let tab = 'jobs', sub = 'review', pbFile = null, poll = null;

const I = {
  ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>',
  mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  clip: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg>',
  undo: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  send: '<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const SRC = {Jev: 'Jev', model: 'Fit', keyword: 'Keyword'};
const SRC_TIP = {Jev: 'Jev match probability', model: 'Model fit score (Jev not connected)', keyword: 'Keyword match against your roles (not yet model-scored)'};
let gid = 0;
// your scale: 90+ green, 80+ blue, 50+ orange; under 50 is never applied to
const tier = v => v >= 90 ? 'var(--green)' : v >= 80 ? 'var(--blue)' : v >= 50 ? 'var(--orange)' : 'var(--faint)';
function ring(c, small) {
  if (c.match == null) return '<span class="unrated" title="Not rated yet">Not rated</span>';
  const r = 20, C = 2 * Math.PI * r, v = Math.max(0, Math.min(100, c.match)), col = tier(v);
  return `<div class="score" title="${SRC_TIP[c.match_src] || ''}"><div class="ring ${small ? 'sm' : ''}"><svg viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="${r}" stroke="var(--sunk)" stroke-width="4" fill="none"/><circle cx="24" cy="24" r="${r}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C * v / 100} ${C}"/></svg><b style="color:${col}">${v}</b></div>${small ? '' : `<small>${SRC[c.match_src] || ''}</small>`}</div>`;
}
const mono = name => `<div class="mono">${esc((name || '?').trim()[0] || '?').toUpperCase()}</div>`;

function modal(head, bodyHtml, cls = '') {
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('data-lve-skip', '');
  m.innerHTML = `<div class="win ${cls}"><div class="win-h">${head}<button class="iconbtn" aria-label="Close">${I.x}</button></div><div class="win-b">${bodyHtml}</div></div>`;
  const close = () => { m.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') close(); };
  m.onclick = e => { if (e.target === m || e.target.closest('.iconbtn')) close(); };
  document.addEventListener('keydown', k); document.body.appendChild(m);
}
async function showJD(id) {
  const d = await api(`/api/jobs/${id}/description`);
  modal(`${mono(d.company)}<div class="job-t"><div class="job-co">${esc(d.company)}${d.location ? ' · ' + esc(d.location) : ''}</div><h3>${esc(d.title)}</h3></div>${d.url ? `<a class="btn sm" href="${esc(d.url)}" target="_blank">Open posting${I.ext}</a>` : ''}`,
    esc(d.text || 'No description saved for this posting.'));
}
function showImg(src, company, label, open) {
  modal(`<div class="job-t"><div class="job-co">${esc(company)}</div><h3>${esc(label)}</h3></div><a class="btn sm" href="${open}" target="_blank">Open full size${I.ext}</a>`, `<img src="${src}" alt="">`, 'img');
}
async function setStage(id, stage) { await post(`/api/applications/${id}/stage`, {stage}); toast('Status updated'); render(); }
function ago(s) { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 6e4); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; }
async function showRefresh() {
  const r = await api('/api/refresh'), b = $('#refresh'), cap = $('#refresh-cap');
  b.classList.toggle('busy', r.running); b.disabled = r.running; b.querySelector('span').textContent = r.running ? 'Refreshing…' : 'Refresh';
  const bits = r.at ? [`${r.new} new ${r.new === 1 ? 'job' : 'jobs'}`, r.replies ? `${r.replies} ${r.replies === 1 ? 'reply' : 'replies'}` : '', r.updated ? 'app updated' : ''].filter(Boolean).join(' · ') : '';
  cap.textContent = r.running ? (ACCTS && ACCTS.demo ? 'Updating, checking job boards' : 'Updating, checking email and job boards') : r.failed ? 'Refresh failed: see data/refresh.log' : r.at ? `Updated ${ago(r.at)} · ${bits}` : 'Not refreshed yet';
  return r;
}
// one button for everything: the app's newest version, new jobs, and replies that move each application along
async function refreshJobs() {
  await post('/api/refresh'); await showRefresh();
  clearInterval(window._rp); window._rp = setInterval(async () => {
    const r = await showRefresh(); if (r.running) return;
    clearInterval(window._rp);
    if (r.failed) return toast('Refresh failed');
    toast([`${r.new} new ${r.new === 1 ? 'job' : 'jobs'}`, `${r.replies || 0} new ${r.replies === 1 ? 'reply' : 'replies'}`, r.updated ? `app updated (${r.updated} change${r.updated === 1 ? '' : 's'})` : 'app up to date'].join(' · '));
    if (r.update_error) toast(r.update_error);
    if (r.restarting) {                      // the server is starting again on the new code: wait for it, then reload
      $('#refresh-cap').textContent = 'Restarting on the new version…';
      for (let i = 0; i < 40; i++) { await new Promise(ok => setTimeout(ok, 750)); try { await fetch('/api/config'); return location.reload(); } catch (e) {} }
    } else if (r.updated) setTimeout(() => location.reload(), 1200);
    else render();
  }, 3000);
}
async function decide(id, what) { const r = await post(`/api/applications/${id}/${what}`); if (r && r.msg) toast(r.msg); sel[sub] = null; render(); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 5000); }
async function reject(id) { const why = prompt('Why not? (optional; the agent learns from it)'); if (why === null) return; await post(`/api/applications/${id}/reject`, {note: why}); sel[sub] = null; render(); }
async function saveAnswers(id, isEmail, b) {
  const box = $('#detail');
  if (isEmail) await post(`/api/applications/${id}/edit`, {email_to: box.querySelector('[data-k=to]').value, email_subject: box.querySelector('[data-k=subject]').value, email_body: box.querySelector('[data-k=body]').value});
  else {
    const r = await post(`/api/applications/${id}/answers`, {answers: [...box.querySelectorAll('[data-q]')].map(i => ({q: i.dataset.q, a: i.value})).filter(x => x.a.trim())});
    if (r && r.saved) toast(`Saved ${r.saved === 1 ? 'that answer' : r.saved + ' answers'} for next time${r.elsewhere ? `, and answered the same question on ${r.elsewhere === 1 ? 'another application' : r.elsewhere + ' other applications'}` : ''}. See Storybook → Saved answers.`);
  }
  b.innerHTML = I.check + 'Saved'; editing = false; setTimeout(() => render(), 400);
}
async function prep(id, b) { b.innerHTML = '<span class="spin"></span>Preparing…'; b.disabled = true; const r = await post(`/api/jobs/${id}/prepare`); if (r && r.ok === false) { alert(r.msg); return render(); } watchPrep(); }
async function skip(id) { await post(`/api/jobs/${id}/skip`); sel[sub] = null; render(); }
function watchPrep() { clearInterval(poll); poll = setInterval(async () => { const t = await api('/api/board?tab=todo'); if (!t.some(x => x.preparing === 'running')) { clearInterval(poll); render(); } }, 3000); }

let sel = {review: null, todo: null, applied: null}, editing = false, mobileOpen = false;
const prepPick = new Set();   // Not started: jobs ticked for Prepare selected
const keyOf = c => sub === 'todo' ? c.job_id : c.app_id;
const PIN = '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const CASH = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>';
const CAL = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

const STAGE = {applied: ['Applied', 'var(--faint)'], confirmation: ['Received', 'var(--mute)'], next_step: ['Next step', 'var(--blue)'],
  interview: ['Interview', 'var(--green)'], offer: ['Offer', 'var(--orange)'], rejected: ['Rejected', 'var(--ink2)']};
function stageOf(c) {
  if (c.status !== 'sent') return 'applied';
  if ((c.stage || 'applied') === 'applied' || c.stage === 'confirmation') {
    const days = c.sent_at ? Math.floor((Date.now() - new Date(c.sent_at)) / 864e5) : 0;
    if (days >= 21) return 'quiet';
  }
  return c.stage || 'applied';
}
function stageChip(c) {
  const s = stageOf(c);
  if (s === 'quiet') return '<span class="stg" style="--c:var(--faint)">No reply · 3+ wks</span>';
  const [l, col] = STAGE[s] || STAGE.applied;
  return `<span class="stg" style="--c:${col}">${l}</span>`;
}

function queueItem(c) {
  const needs = (c.needs || []).length;
  const st = sub === 'review' ? (needs ? `<div class="st o"><span class="dot"></span>${needs} ${needs === 1 ? 'question' : 'questions'} for you</div>` : `<div class="st r"><span class="dot"></span>Ready to approve</div>`)
    : sub === 'applied' ? appliedLine(c)
    : c.preparing === 'running' ? `<div class="st o"><span class="spin"></span>Preparing…</div>` : (c.location ? `<div class="st" style="display:block">${esc(c.location)}</div>` : '');
  const item = `<button class="qi ${keyOf(c) === sel[sub] ? 'on' : ''}" onclick="pickJob(${keyOf(c)})">${mono(c.company)}<div class="t"><div class="c">${esc(c.company)}</div><div class="ti">${esc(c.title)}</div>${st}</div>${ring(c, true)}</button>`;
  if (sub !== 'todo') return item;
  const busy = c.preparing === 'running';
  return `<div class="qrow ${keyOf(c) === sel[sub] ? 'on' : ''}"><label class="ck" title="Select for Prepare selected"><input type="checkbox" ${prepPick.has(c.job_id) ? 'checked' : ''} ${busy ? 'disabled' : ''} onchange="togglePick(${c.job_id}, this.checked)"></label>${item}</div>`;
}
function togglePick(id, on) { on ? prepPick.add(id) : prepPick.delete(id); bulkBar(); }
function pickAll(on) { document.querySelectorAll('.qrow .ck input:not(:disabled)').forEach(i => { i.checked = on; togglePick(+i.getAttribute('onchange').match(/\d+/)[0], on); }); }
function bulkBar() {
  const n = prepPick.size, b = $('#bulk-go'), a = $('#bulk-all');
  if (b) { b.disabled = !n; b.textContent = n ? `Prepare selected (${n})` : 'Prepare selected'; }
  if (a) { const boxes = [...document.querySelectorAll('.qrow .ck input:not(:disabled)')]; a.checked = boxes.length > 0 && boxes.every(i => i.checked); }
}
async function prepPicked(b) {
  const ids = [...prepPick]; if (!ids.length) return;
  b.innerHTML = '<span class="spin"></span>Starting…'; b.disabled = true;
  const r = await post('/api/jobs/prepare-many', {job_ids: ids});
  if (r && r.ok === false) { alert(r.msg); return render(); }
  prepPick.clear();
  toast(`Preparing ${r.started} ${r.started === 1 ? 'job' : 'jobs'}, one at a time${r.skipped ? ` (${r.skipped} skipped: below a 50% match or already preparing)` : ''}. Each one moves to Waiting for review when it's ready.`);
  render(); watchPrep();
}
function pickJob(k) { sel[sub] = k; editing = false; mobileOpen = true; render().then(() => { if (innerWidth <= 760) window.scrollTo(0, 0); }); }

function header(c) {
  const facts = [c.location && `<span class="fact">${PIN}${esc(c.location)}</span>`, c.salary && `<span class="fact">${CASH}<b>${esc(c.salary)}</b></span>`, c.start && `<span class="fact">${CAL}Starts ${esc(c.start)}</span>`].filter(Boolean).join('');
  const links = [c.url && `<a class="lk" href="${esc(c.url)}" target="_blank">Job posting${I.ext}</a>`, sub !== 'todo' && `<a class="lk" onclick="showJD(${c.job_id})">Read the description</a>`,
    c.email_to ? `<span style="color:var(--mute)">Send to ${esc(c.email_to)}</span>` : c.apply_url && sub !== 'todo' ? `<a class="lk" href="${esc(c.apply_url)}" target="_blank">Application form${I.ext}</a>` : ''].filter(Boolean).join('');
  return `<button class="btn quiet sm back-m" onclick="mobileOpen=false;render()">← All jobs</button>
    <div class="d-head">${mono(c.company).replace('class="mono"', 'class="mono lg"')}<div class="tt"><div class="co">${esc(c.company)}</div><h2>${esc(c.title)}</h2></div>${ring(c)}</div>
    ${facts ? `<div class="facts">${facts}</div>` : ''}<div class="links">${links}</div>`;
}

// "Why us?", "why do you want to work here", a cover letter field: one thing, shown as a third document to review
const COVER_RX = /\bwhy\b.*\b(us|join|work|company|here|this|apply|applying|role)\b|why (do|would) you want|interested in (joining|working|this|our)|excit\w* (you )?about|what excites|what (draws|attracts)|motivates you to|cover letter/i;
const COVERS = {};
function coverOf(c) {
  const isCover = q => COVER_RX.test(q) || (c.company && new RegExp('\\bwhy\\s+' + c.company.split(' ')[0].replace(/[^\w]/g, ''), 'i').test(q));
  const f = (c.fields || []).find(x => isCover(x.q)), need = (c.needs || []).find(isCover);
  if (!f && !need) return null;
  return COVERS[c.app_id] = {q: f ? f.q : need, text: f ? f.a : '', need: !f, company: c.company};
}
function coverDoc(c, done) {
  const cv = coverOf(c); if (!cv) return '';
  return `<button class="doc" onclick="showCover(${c.app_id}, ${done})"><div class="pv"><div class="mail cover ${cv.need ? 'need' : ''}">${cv.need ? '<b>Needs your draft</b>\n\n' : ''}${esc(cv.text || cv.q)}</div></div>
    <div class="lb">Cover letter <span>· why ${esc(c.company)}</span></div></button>`;
}
function showCover(id, done) {
  const cv = COVERS[id];
  modal(`<div class="job-t"><div class="job-co">${esc(cv.company)} · cover letter</div><h3>${esc(cv.q)}</h3></div>`,
    done ? esc(cv.text) : `${cv.need ? `<p class="hint" style="margin:0 0 10px">${esc(cv.company)} asks for your own first draft here. Write it, and it goes out with this application once you approve it.</p>` : ''}
      <textarea id="cover-text" style="min-height:300px;white-space:pre-wrap">${esc(cv.text)}</textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px"><button class="btn primary sm" onclick="saveCover(${id}, this)">${I.check}Save</button>
      <span class="hint">${cv.text ? (cv.text.trim().split(/\s+/).length + ' words') : ''}</span></div>`);
}
async function saveCover(id, b) {
  const cv = COVERS[id], text = $('#cover-text').value;
  await post(`/api/applications/${id}/answers`, {answers: [{q: cv.q, a: text}]});
  b.innerHTML = I.check + 'Saved'; setTimeout(() => { document.querySelector('.modal')?.remove(); render(); }, 400);
}

function submissionBox(c) {
  const x = submission(c), mails = (c.replies || []).filter(r => r.kind === 'confirmation').sort((a, b) => (a.at || '').localeCompare(b.at || ''));
  return `<div class="section"><div class="sh"><h4>Submission</h4></div>
    <div class="subbox ${x.k}">${subChip(c)}<span>${esc(x.note)}${c.sent_at && x.k.startsWith('ok') ? ' · ' + day(c.sent_at) : ''}</span>
      ${x.k === 'failed' ? `<button class="btn sm primary" style="margin-left:auto" onclick="decide(${c.app_id},'approve')">Try again</button>` : ''}</div>
    ${mails.map(r => `<div class="reply mailcard"><div class="rh">${I.check}<b>${esc(r.subject)}</b><span class="rs">${esc((r.sender || '').replace(/<.*>/, ''))} · ${day(r.at)}</span>
      ${r.view_url ? `<a class="lk" href="${esc(r.view_url)}" target="_blank">Open in Gmail${I.ext}</a>` : ''}</div><p>${esc((r.snippet || '').replace(/\[https?:[^\]]+\]/g, '').trim().slice(0, 500))}</p></div>`).join('')}
    ${x.k === 'ok-noemail' ? '<p class="hint" style="margin:8px 0 0">The inbox is checked once a day; the confirmation email shows here when it arrives.</p>' : ''}</div>`;
}
function detailApp(c, done) {
  const needs = c.needs || [];
  const shot = c.has_shot
    ? `<button class="doc" onclick="showImg('/screen/${c.app_id}', ${esc(JSON.stringify(c.company))}, 'Application', '/screen/${c.app_id}')"><div class="pv"><img src="/screen/${c.app_id}" alt=""></div><div class="lb">Application <span>· filled form</span></div></button>`
    : c.email_body ? `<div class="doc" style="cursor:default"><div class="pv"><div class="mail"><b>${esc(c.email_subject || '')}</b>\n\n${esc(c.email_body)}</div></div><div class="lb">Email <span>· draft</span></div></div>`
    : `<div class="doc" style="cursor:default"><div class="pv"><div class="none">No form captured</div></div><div class="lb">Application</div></div>`;
  const ask = needs.length && !done ? `<div class="section ask"><div class="sh"><h4>${I.alert}Questions for you <span class="n">${needs.length}</span></h4></div>
      <div class="qa">${needs.map(q => { const o = (c.needs_options || {})[q]; return `<div class="field"><label>${esc(q)}</label>${o && o.length
        ? `<select data-q="${esc(q)}"><option value="">Choose…</option>${o.map(x => `<option>${esc(x)}</option>`).join('')}</select>`
        : `<input type="text" data-q="${esc(q)}" placeholder="Your answer">`}</div>`; }).join('')}</div>
      <div style="margin-top:14px"><button class="btn primary sm" onclick="saveAnswers(${c.app_id}, false, this)">Save answers</button></div></div>` : '';
  const ed = editing && !done;
  const filled = c.email_body
    ? `<div class="kv"><div class="k">To</div><div class="v">${ed ? `<input type="text" data-k="to" value="${esc(c.email_to || '')}">` : esc(c.email_to || '')}</div>
        <div class="k">Subject</div><div class="v">${ed ? `<input type="text" data-k="subject" value="${esc(c.email_subject || '')}">` : esc(c.email_subject || '')}</div>
        <div class="k">Message</div><div class="v">${ed ? `<textarea data-k="body" style="min-height:240px">${esc(c.email_body)}</textarea>` : esc(c.email_body)}</div></div>`
    : `<div class="kv">${c.fields.map(f => `<div class="k">${esc(f.q)}</div><div class="v">${ed ? (f.a.length > 80 ? `<textarea data-q="${esc(f.q)}">${esc(f.a)}</textarea>` : `<input type="text" data-q="${esc(f.q)}" value="${esc(f.a)}">`) : esc(f.a)}</div>`).join('')}</div>`;
  return `<div class="d-scroll">${header(c)}
      ${done ? submissionBox(c) : ''}
      ${done ? `<div class="section"><div class="sh"><h4>Status</h4>
        <select style="width:auto" onchange="setStage(${c.app_id}, this.value)">${['applied', 'confirmation', 'next_step', 'interview', 'offer', 'rejected'].map(k => `<option value="${k}" ${(c.stage || 'applied') === k ? 'selected' : ''}>${STAGE[k][0]}</option>`).join('')}</select></div>
        ${(c.replies || []).length ? (c.replies || []).map(r => `<div class="reply"><div class="rh">${stageChip({status: 'sent', stage: r.kind === 'other' ? 'applied' : r.kind})}<b>${esc(r.subject)}</b><span class="rs">${esc((r.sender || '').replace(/<.*>/, ''))} · ${day(r.at)}</span>

// Applied: the same list as the other tabs, grouped. Replies (heard back, then rejected) first, then no reply yet;
// each item's status line is its latest email's subject
const appliedBucket = c => { const st = stageOf(c); return ['next_step', 'interview', 'offer'].includes(st) ? 'heard' : st === 'rejected' ? 'rejected' : 'waiting'; };
const latestReply = c => (c.replies || []).slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0];
const appliedOrder = ap => ['heard', 'rejected', 'waiting'].flatMap(k => ap.filter(c => appliedBucket(c) === k));
function submission(c) {
  const conf = (c.replies || []).filter(r => r.kind === 'confirmation' || r.kind === 'next_step' || r.kind === 'interview' || r.kind === 'offer' || r.kind === 'rejected');
  if (c.status === 'failed') return {k: 'failed', label: 'Failed', note: c.error || 'Not submitted'};
  if (c.status === 'approved' || c.submitting) return {k: 'busy', label: 'In progress', note: c.submitting ? 'Submitting in a browser window on your Mac' : 'Approved, waiting to be submitted'};
  if (ACCTS && ACCTS.demo) return {k: 'busy', label: 'Demo', note: 'Demo account: nothing was sent'};
  return conf.length ? {k: 'ok', label: 'Submitted', note: 'Confirmed by email'} : {k: 'ok-noemail', label: 'Submitted', note: 'No confirmation email yet'};
}
function subChip(c) { const x = submission(c); return `<span class="sub ${x.k}">${x.k === 'ok' ? I.check : x.k === 'failed' ? '✕ ' : x.k === 'busy' ? '• ' : ''}${x.label}</span>`; }
function appliedLine(c) {
  const r = latestReply(c), col = (STAGE[stageOf(c)] || STAGE.applied)[1];
  const x = submission(c);

  return `<div class="st" style="display:flex;gap:6px">${subChip(c)}<span class="sj">${r ? esc(r.subject) : esc(x.note) + ' · ' + day(c.sent_at)}</span></div>`;
}
function appliedQueue(list) {
  const items = k => list.filter(c => appliedBucket(c) === k).map(queueItem).join('') || '<div class="qnone">None yet.</div>';
  const n = k => list.filter(c => appliedBucket(c) === k).length;
  const top = list.filter(c => ['failed', 'busy'].includes(submission(c).k));
  const rest = list.filter(c => !top.includes(c)); list = rest;
  return `${top.length ? `<div class="qh">Needs attention<span>${top.length}</span></div>${top.map(queueItem).join('')}` : ''}<div class="qh">Replies</div>
    <div class="qh2">Heard back<span>${n('heard')}</span></div>${items('heard')}
    <div class="qh2">Rejected<span>${n('rejected')}</span></div>${items('rejected')}
    <div class="qh">No reply yet<span>${n('waiting')}</span></div>${items('waiting')}`;
}

    <button class="btn sm primary" ${busy ? 'disabled' : ''} onclick="reviseResume(${id})">${busy ? '<span class="spin"></span>Revising…' : 'Revise'}</button></div></div>`;

async function reviseResume(id) {
  const t = (REVD[id] || '').trim(); if (!t) return toast('Say or type what to change first.');
  const r = await post(`/api/applications/${id}/revise`, {text: t});
  if (r && r.ok === false) return toast(r.msg);
  REV[id] = 'running'; REVD[id] = ''; render();
  const iv = setInterval(async () => {
    const st = await api(`/api/applications/${id}/revise-status`);
    if (st.state === 'running') return;
    clearInterval(iv);
    REV[id] = st.state === 'done' ? 'done' : 'error'; REVV[id] = Date.now();
    if (st.state !== 'done') toast(st.error || 'Could not revise the résumé.');
    render();
  }, 2500);
}
let recInto = null;
function speakInto(fieldId, btn, id) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return noVoice($('#' + fieldId));
  if (recInto) { recInto.stop(); return; }
  const box = $('#' + fieldId), start = box.value ? box.value + ' ' : '';
  recInto = new SR(); recInto.continuous = true; recInto.interimResults = true; recInto.lang = navigator.language || 'en-US';
  recInto.onresult = e => { box.value = start + Array.from(e.results).map(r => r[0].transcript).join(''); REVD[id] = box.value; };
  recInto.onend = () => { recInto = null; btn.classList.remove('on'); };
  btn.classList.add('on'); recInto.start();
}
const noVoice = box => { if (/Windows/.test(navigator.userAgent)) { box && box.focus(); toast('Press Windows key + H to dictate into this box.'); } else alert('Voice input needs Chrome or Safari.'); };
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return noVoice($('#ask'));
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  const box = $('#ask'), start = box.value ? box.value + ' ' : '';
  rec.onresult = e => { box.value = start + Array.from(e.results).map(r => r[0].transcript).join(''); draft = box.value; };
  rec.onend = () => { rec = null; $('#mic') && $('#mic').classList.remove('on'); };
  $('#mic').classList.add('on'); rec.start();
}
async function back() { await post('/api/storybook/back'); render(); }
async function prop(id, a) { const r = await post(`/api/proposals/${id}/${a}`); if (r && r.ok === false) alert(r.msg); render(); }

// ---- accounts: switching restarts the dashboard on the chosen account, then the page reloads ----------------------

document.addEventListener('click', () => { const m = $('#acct-menu'); if (m) m.hidden = true; });
async function backOnline(text) {

async function newDemo() { const r = await post('/api/accounts/demo'); if (r.ok) backOnline('Creating an empty demo account…'); }

// ---- Setup: the first three steps let the agent work; the rest make it better --------------------------------
let setupOpen = null, SETUP = null;
function setupBadge(st) { const n = st.steps.filter(x => x.required && !x.done).length; const b = $('#c-setup'); if (b) b.textContent = n || ''; }
const NAME_HINT = {anthropic: 'claude-opus-5-5', 'claude-code': 'Empty: your default model', ollama: 'qwen3:32b', openai: 'Qwen/Qwen3-32B'};
const DRAFT_HINT = {anthropic: 'claude-haiku-5-5', 'claude-code': 'Empty: your default model', ollama: 'qwen3:4b', openai: 'Qwen/Qwen3-8B'};
const hint = (tier, pv) => (tier === 'draft' ? DRAFT_HINT : NAME_HINT)[pv] || '';
const SETUP_BODY = {
  model: st => {
    const m = st.models, opts = (cur, draft) => (draft ? [['', 'None: the model does everything']] : [])
      .concat(Object.entries(st.providers)).map(([k, l]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(l)}</option>`).join('');
    const row = (tier, cur, title, help) => `<div class="mrow"><div class="ml">${title}<small>${help}</small></div>
      <select id="p-${tier}" onchange="setupFields()">${opts(cur.provider, tier === 'draft')}</select>
      <input type="text" id="n-${tier}" value="${esc(cur.name)}" placeholder="${esc(hint(tier, cur.provider))}"></div>`;
    return row('model', m.model, 'The model', 'Writes everything that goes out under your name, and decides what is true about you.')
      + row('draft', m.draft, 'Draft model', 'Optional. Ranks every posting and proposes fixes from your notes. Empty: the model does it.')
      + `<div id="mfields"></div>
      <div class="srow"><button class="btn primary sm" onclick="saveModels()">Save</button><button class="btn sm" onclick="testSetup('model', this)">Test the model</button>
        <button class="btn sm" onclick="testSetup('draft', this)">Test the draft model</button><span class="res" id="res-model"></span></div>
      <p class="hint">Open-source models: install <a class="lk" href="https://ollama.com" target="_blank">Ollama</a>, run <code>ollama pull qwen3:32b</code>, and choose Ollama.
      vLLM, LM Studio, llama.cpp and OpenRouter work as an OpenAI-compatible server. Every step's model and prompt:
      <a class="lk" href="https://github.com/siennachen2002/job-hunting-agent/blob/main/docs/pipeline.md" target="_blank">docs/pipeline.md</a>.</p>`;
  },
  standing: st => `<p>The questions almost every form asks: legal name, work authorization, sponsorship, relocation, education, and the voluntary
    self-identification questions (each has <i>Prefer not to say</i>). Answer once; the agent fills them everywhere.</p>
    <div class="srow"><button class="btn primary sm" onclick="tab='storybook';pbFile='@standing';render()">Answer them</button>
    ${st.demo ? `<button class="btn sm" onclick="post('/api/demo/answers').then(r => { toast(r.ok ? 'Filled in the sample answers' : r.msg); setupOpen = null; loadAccounts(); render(); })">Use the sample answers</button>` : ''}</div>`,
  storybook: st => `<p>Drop your old résumés, reference letters, papers or notes, or just talk. The agent turns them into résumé lines, each with its source,
    and never invents anything. Back undoes it.</p>
    <div class="srow"><button class="btn primary sm" onclick="tab='storybook';pbFile=null;render()">Tell it everything</button>
    ${st.demo ? `<button class="btn sm" onclick="post('/api/demo/materials').then(() => toast('The sample material is open: drag the files onto Drop anything'))">Show the sample material</button>` : ''}</div>`,
  mailbox: st => `<div class="frow"><label>Your application email<input type="text" id="mail-addr" value="${esc(st.mailbox.address)}" placeholder="you@gmail.com"></label>
      <label>App password<input type="password" id="mail-pw" autocomplete="off" placeholder="${st.mailbox.configured ? 'Saved. Paste a new one to replace it' : 'abcd efgh ijkl mnop'}"></label></div>
    <p class="hint">${st.mailbox.gmail || !st.mailbox.address ? 'Gmail: turn on 2-Step Verification, then <a class="lk" href="https://myaccount.google.com/apppasswords" target="_blank">create an app password</a> and paste it here.' : 'Use an app password from your email provider (IMAP and SMTP).'}
      The agent only reads: nothing is marked read, moved or deleted. It sends only the emails you approve, and you can revoke the app password any time.</p>
    <div class="srow"><button class="btn primary sm" onclick="saveSetup({JHA_MAIL_ADDRESS: $('#mail-addr').value, JHA_MAIL_APP_PASSWORD: $('#mail-pw').value})">Save</button>
      <button class="btn sm" onclick="testSetup('mail', this)">Test</button><span class="res" id="res-mail"></span></div>`,
  browser: st => `<p>Only for sites where you keep an account, like a company's Workday. Sign in there yourself, once; the agent reuses the session
    when it fills that site's forms. It never sees, types or keeps a password. ${st.browser.chrome ? 'It opens Google Chrome with its own profile, separate from yours.' : 'It opens its own browser window.'}</p>
    <p class="hint">No need to sign in to LinkedIn or Indeed: they are never automated. CAPTCHAs and emailed security codes are always yours: when one appears,
    the agent stops and you finish it in its window.</p>
    <div class="srow"><button class="btn primary sm" onclick="post('/api/setup/browser').then(() => toast('The agent\'s browser is opening. Sign in, then close it.'))">Open the agent's browser</button></div>`,
  phone: st => { setTimeout(phoneStep, 0); return '<div id="phone-step"><span class="spin"></span></div>'; },
  keys: st => {
    const k = st.models.keys, saved = 'Saved. Paste a new one to replace it';
    const row = (key, label, ph, help) => `<label>${label}<input type="password" id="key-${key}" autocomplete="off" placeholder="${k[key] ? saved : ph}">${help ? `<small class="hint">${help}</small>` : ''}</label>`;
    return `<p>Every key the agent uses, in one place. They are written to <code>.env</code> on this computer and never shown again; leave a box empty to keep what is saved.</p>

      ${row('ANTHROPIC_API_KEY', 'Anthropic API key', 'sk-ant-…', 'Only if your model is Anthropic (Connect a model).')}
      ${row('JHA_OPENAI_API_KEY', 'OpenAI-compatible server key', 'optional', 'Only if your model server needs one.')}
      ${row('JHA_MAIL_APP_PASSWORD', 'Mailbox app password', 'abcd efgh ijkl mnop', 'For reading replies; the address is under Connect your application mailbox.')}</div>
    <div class="srow"><button class="btn primary sm" onclick="saveSetup(Object.fromEntries([...document.querySelectorAll('[id^=key-]')].map(i => [i.id.slice(4), i.value])))">Save</button>

  },
};
async function phoneStep() {
  const box = $('#phone-step'); if (!box) return;
  const ph = await api('/api/phone');
  const step = (n, done, body) => `<div class="pstep ${done ? 'done' : ''}"><span class="num">${done ? I.check : n}</span><div>${body}</div></div>`;
  box.innerHTML = `<p>Your phone reaches this Mac through <b>Tailscale</b>: a free app that links your own devices privately, at home or on cellular. Nobody else can reach the page, and it also needs your private link.</p>
    ${step(1, ph.tailscale, `<b>Install Tailscale on this Mac and sign in.</b> <a class="lk" href="https://tailscale.com/download/mac" target="_blank">tailscale.com/download${I.ext}</a>${ph.tailscale ? ' <span class="res ok">Connected</span>' : ''}`)}
    ${step(2, false, `<b>Install Tailscale on your iPhone</b> from the App Store and sign in with the <b>same account</b>.`)}
    ${step(3, ph.listening && ph.has_key, `<b>Let your phone in.</b> Makes a private key and lets devices with your link reach this page.
      <div class="srow">${ph.listening && ph.has_key ? '<span class="res ok">On</span>' : `<button class="btn primary sm" onclick="phoneOn(this)">Turn on</button>`}</div>`)}
    ${step(4, false, ph.link ? `<b>Open your private link on the phone</b>: scan it with the camera, then in Safari tap Share → <i>Add to Home Screen</i>.
      <div class="qr" id="phone-qr"></div><div class="plink"><code>${esc(ph.link)}</code><button class="btn sm" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(ph.link))}).then(() => toast('Copied'))">Copy</button></div>
      <p class="hint">Keep this link to yourself: it opens your applications. This Mac has to be awake with the app open.</p>`
      : `<b>Open your private link on the phone.</b> It shows here once steps 1 and 3 are done.`)}`;
  if (ph.link) {
    if (!window.QRCode) await new Promise(ok => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = ok; sc.onerror = ok; document.head.appendChild(sc); });
    if (window.QRCode) new QRCode($('#phone-qr'), {text: ph.link, width: 168, height: 168});
  }
}
async function phoneOn(b) {
  b.innerHTML = '<span class="spin"></span>Turning on…'; b.disabled = true;
  await post('/api/phone/enable');
  for (let i = 0; i < 60; i++) { await new Promise(ok => setTimeout(ok, 500)); try { if ((await fetch('/api/config')).ok) { setupOpen = 'phone'; return render(); } } catch (e) {} }
}
async function renderSetup(p) {
  const st = SETUP = await api('/api/setup');
  setupBadge(st);
  const req = st.steps.filter(x => x.required), done = req.filter(x => x.done).length;
  if (setupOpen === null) { const first = st.steps.find(x => x.required && !x.done); setupOpen = first ? first.id : ''; }
  p.innerHTML = `<div class="ph"><div><h1>Setup</h1><p class="sub">The first three steps let the agent work; the others make it better. Everything stays on this computer.</p></div></div>
    ${st.ready ? `<div class="panel ready"><span style="color:var(--green)">${I.check}</span><div style="flex:1"><b>You're set.</b> Press Refresh at the bottom left to find your first jobs.</div>
        <button class="btn sm" onclick="tab='jobs';render()">Job applications</button></div>`
      : `<div class="prog"><i style="width:${Math.round(100 * done / req.length)}%"></i></div><p class="sub" style="margin:0 0 16px">${done} of ${req.length} required steps done</p>`}
    ${st.steps.map((x, i) => `<section class="panel stp ${x.done ? 'done' : ''} ${setupOpen === x.id ? 'open' : ''}">
      <button class="stp-h" onclick="setupOpen = setupOpen === '${x.id}' ? '' : '${x.id}'; render()"><span class="num">${x.done ? I.check : i + 1}</span>
        <span class="tt"><b>${esc(x.title)}</b>${x.required ? '' : '<span class="opt">Optional</span>'}<small>${esc(x.detail)}</small></span><span class="cv">›</span></button>
      ${setupOpen === x.id ? `<div class="stp-b">${SETUP_BODY[x.id](st)}</div>` : ''}</section>`).join('')}`;
  setupFields();
}
function setupFields() {
  const box = $('#mfields'); if (!box || !SETUP) return;
  const ps = ['model', 'draft'].map(t => $('#p-' + t).value);
  ['model', 'draft'].forEach(t => { const n = $('#n-' + t); n.placeholder = hint(t, $('#p-' + t).value); n.disabled = !$('#p-' + t).value; });
  const k = SETUP.models.keys, saved = 'Saved. Paste a new one to replace it';
  box.innerHTML = [
    ps.includes('anthropic') && `<label>Anthropic API key<input type="password" id="k-ANTHROPIC_API_KEY" autocomplete="off" placeholder="${k.ANTHROPIC_API_KEY ? saved : 'sk-ant-…'}"></label>`,
    ps.includes('openai') && `<label>Server address<input type="text" id="k-JHA_OPENAI_BASE_URL" value="${esc(SETUP.models.openai_base_url)}" placeholder="http://localhost:8000/v1"></label>`,
    ps.includes('openai') && `<label>Server API key (if it needs one)<input type="password" id="k-JHA_OPENAI_API_KEY" autocomplete="off" placeholder="${k.JHA_OPENAI_API_KEY ? saved : 'optional'}"></label>`,
    ps.includes('ollama') && `<label>Ollama address<input type="text" id="k-OLLAMA_BASE_URL" value="${esc(SETUP.models.ollama_base_url)}" placeholder="http://localhost:11434/v1"></label>`,
  ].filter(Boolean).join('');
  box.className = box.innerHTML ? 'frow' : '';
  if (ps.includes('claude-code')) box.insertAdjacentHTML('beforeend', '<p class="hint" style="grid-column:1/-1">Claude Code: install it and sign in once (<code>claude</code> in a terminal). No API key needed.</p>');
}
async function saveSetup(values) {
  const r = await post('/api/setup/env', {values});
  toast(r.ok ? 'Saved' : 'Could not save'); await render();
}
function saveModels() {
  const spec = t => { const pv = $('#p-' + t).value, n = $('#n-' + t).value.trim(); return pv ? pv + (n ? ':' + n : '') : ''; };
  const v = {JHA_MODEL: spec('model'), JHA_DRAFT_MODEL: spec('draft')};
  document.querySelectorAll('#mfields input').forEach(i => { v[i.id.slice(2)] = i.value; });
  saveSetup(v);
}
async function testSetup(what, btn) {
  const out = $('#res-' + (what === 'draft' ? 'model' : what)), old = btn.innerHTML;
  btn.innerHTML = '<span class="spin"></span>Testing…'; btn.disabled = true; out.textContent = ''; out.className = 'res';
  const r = await post('/api/setup/test', {what});
  btn.innerHTML = old; btn.disabled = false;
  out.className = 'res ' + (r.ok ? 'ok' : 'bad');
  out.textContent = r.ok ? (r.ms != null ? `${what === 'draft' ? 'Draft model' : 'Model'} answered in ${(r.ms / 1000).toFixed(1)} s (${r.model}).` : r.msg) : (r.error || r.msg || 'Failed');
}

async function renderActivity(p) {
  const ev = await api('/api/events');
  const t = s => new Date(s).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  p.innerHTML = `<div class="ph"><div><h1>Activity</h1><p class="sub">Everything the agent did, newest first.</p></div></div>` + (ev.length
    ? `<div class="feed">${ev.map(e => `<div class="ev"><time>${t(e.at)}</time><span class="node ${esc(e.node)}">${esc(e.node)}</span><div><div>${esc(e.action)}</div>${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}</div></div>`).join('')}</div>`
    : '<div class="empty">Nothing yet.</div>');
}

async function render() {
  document.querySelectorAll('aside .nav').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const p = $('#page');
  if (tab !== 'jobs') document.body.classList.remove('m-detail');
  if (tab === 'jobs') await renderJobs(p);
  else if (tab === 'storybook') await renderStorybook(p);
  else if (tab === 'setup') await renderSetup(p);
  else await renderActivity(p);
}
document.querySelectorAll('aside .nav').forEach(b => b.onclick = () => { tab = b.dataset.tab; mobileOpen = false; clearInterval(poll); render(); window.scrollTo(0, 0); });
loadAccounts();
api('/api/setup').then(st => { setupBadge(st); if (!st.ready) tab = 'setup'; }).catch(() => {}).finally(() => render());
showRefresh(); setInterval(showRefresh, 60000);
</script>
